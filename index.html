<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Realidad aumentada del libro</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      /* Proporción real de la hoja: 501 x 711 */
      --hoja-ancho: 501;
      --hoja-alto: 711;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    /* Video de la cámara de MindAR a pantalla completa */
    body > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
      z-index: 0 !important;
    }

    /* Escena transparente encima de la cámara */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    #mensaje {
      position: fixed;
      z-index: 10;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      font-size: 16px;
    }

    #iniciar {
      display: none;
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #111;
      font-size: 16px;
      cursor: pointer;
    }

    #diagnostico {
      position: fixed;
      z-index: 30;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #7cfc00;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="mensaje">Apunta la cámara hacia la página del libro</div>

  <button id="iniciar" type="button">Reproducir animación</button>

  <div id="diagnostico">Iniciando realidad aumentada...</div>

  <a-scene
    id="escena"
    mindar-image="imageTargetSrc: ./pagina.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes;"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="15000">
      <video
        id="videoAnimacion"
        src="./animacion.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="paginaObjetivo"
      mindar-image-target="targetIndex: 0"
    >
      <!--
        La hoja mide 501 x 711.
        En MindAR el ancho del objetivo es 1, por eso la altura es:
        711 / 501 = 1.41916.
        Esto evita que el video se comporte como una pantalla horizontal.
      -->
      <a-video
        id="videoAR"
        src="#videoAnimacion"
        width="1"
        height="1.41916"
        position="0 0 0.01"
        rotation="0 0 0"
        visible="false"
        material="shader: flat; side: double"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector('#escena');
    const paginaObjetivo = document.querySelector('#paginaObjetivo');
    const video = document.querySelector('#videoAnimacion');
    const videoAR = document.querySelector('#videoAR');
    const mensaje = document.querySelector('#mensaje');
    const botonIniciar = document.querySelector('#iniciar');
    const diagnostico = document.querySelector('#diagnostico');

    const lineas = [];

    function log(texto) {
      lineas.push(texto);
      diagnostico.textContent = lineas.slice(-6).join('\n');
    }

    log('Cargando MindAR...');
    log('HTTPS: ' + (window.isSecureContext ? 'sí' : 'NO'));

    fetch('./pagina.mind', { method: 'HEAD' })
      .then((respuesta) => {
        log(
          'pagina.mind: ' +
            (respuesta.ok ? 'OK' : 'ERROR ' + respuesta.status)
        );
      })
      .catch(() => log('pagina.mind: no se pudo comprobar'));

    fetch('./animacion.mp4', { method: 'HEAD' })
      .then((respuesta) => {
        log(
          'animacion.mp4: ' +
            (respuesta.ok ? 'OK' : 'ERROR ' + respuesta.status)
        );
      })
      .catch(() => log('animacion.mp4: no se pudo comprobar'));

    escena.addEventListener('arReady', () => {
      log('Cámara lista');
      mensaje.textContent = 'Apunta la cámara hacia la página del libro';
    });

    escena.addEventListener('arError', (evento) => {
      console.error('Error de MindAR:', evento);
      log('Error: no se pudo iniciar la cámara');
      mensaje.textContent = 'No se pudo abrir la cámara. Revisa los permisos.';
    });

    function reproducirAnimacion() {
      video.muted = true;
      const promesa = video.play();

      if (promesa !== undefined) {
        promesa
          .then(() => {
            botonIniciar.style.display = 'none';
            log('Animación reproduciéndose');
          })
          .catch((error) => {
            console.error('No se pudo reproducir el video:', error);
            botonIniciar.style.display = 'block';
            mensaje.textContent = 'Pulsa el botón para reproducir la animación';
          });
      }
    }

    paginaObjetivo.addEventListener('targetFound', () => {
      log('Página reconocida');
      mensaje.textContent = 'Página reconocida';
      videoAR.setAttribute('visible', 'true');
      video.currentTime = 0;
      reproducirAnimacion();
    });

    paginaObjetivo.addEventListener('targetLost', () => {
      log('Página no visible');
      mensaje.textContent = 'Apunta nuevamente hacia la página';
      videoAR.setAttribute('visible', 'false');
      video.pause();
      botonIniciar.style.display = 'none';
    });

    botonIniciar.addEventListener('click', reproducirAnimacion);

    video.addEventListener('loadeddata', () => log('Video cargado'));

    video.addEventListener('error', () => {
      log('Error al cargar animacion.mp4');
      mensaje.textContent = 'No se pudo cargar la animación.';
    });

    window.addEventListener('error', (evento) => log('Error: ' + evento.message));
  </script>
</body>
</html>
