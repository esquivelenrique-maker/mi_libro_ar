<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Escáner del libro</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #101820; font-family: Arial, Helvetica, sans-serif; }
    [hidden] { display: none !important; }
    #visor { position: fixed; inset: 0; isolation: isolate; z-index: 0; }
    #visor a-scene { width: 100%; height: 100%; }
    #escaner {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .marco {
      position: relative; width: min(78vw, 340px, 70vh); aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.28); border-radius: 16px;
      /* Sin relleno ni sombra: toda la cámara sigue siendo visible. */
    }
    .esquina { position: absolute; width: 36px; height: 36px; border: 3px solid #a3e3cd; }
    .superior-izquierda { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 16px 0 0 0; }
    .superior-derecha { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 16px 0 0; }
    .inferior-izquierda { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 16px; }
    .inferior-derecha { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 16px 0; }
    .linea {
      position: absolute; left: 12px; right: 12px; height: 2px; top: 12px;
      background: #a3e3cd; box-shadow: 0 0 9px rgba(163,227,205,.55);
      animation: escanear 2.6s ease-in-out infinite alternate;
    }
    @keyframes escanear { from { top: 12px; } to { top: calc(100% - 14px); } }
    @media (prefers-reduced-motion: reduce) { .linea { animation: none; top: 50%; } }
    #acciones {
      position: fixed; z-index: 20; left: 20px; right: 20px;
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    #error {
      margin: 0; max-width: 440px; padding: 10px 14px; border-radius: 10px;
      color: #fff; background: rgba(16,24,32,.9); line-height: 1.45;
      font-size: 14px; text-align: center;
    }
    #accion {
      padding: 14px 20px; min-height: 48px; border: 0; border-radius: 12px;
      background: #a3e3cd; color: #10261f; font: bold 15px Arial, sans-serif;
      cursor: pointer;
    }
    #accion:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main id="visor" aria-label="Cámara del libro"></main>
  <div id="escaner" aria-label="Recuadro para escanear el dibujo">
    <div class="marco" aria-hidden="true">
      <span class="esquina superior-izquierda"></span>
      <span class="esquina superior-derecha"></span>
      <span class="esquina inferior-izquierda"></span>
      <span class="esquina inferior-derecha"></span>
      <span class="linea"></span>
    </div>
  </div>
  <!-- Solo aparecen si hay un error o el navegador exige autorizar el video. -->
  <div id="acciones" hidden>
    <p id="error" role="alert" hidden></p>
    <button id="accion" type="button" hidden>Reproducir video</button>
  </div>
  <noscript>Activa JavaScript para abrir la cámara.</noscript>

  <script>
    "use strict";

    // CONFIGURACIÓN. Tus archivos están junto a index.html, sin carpetas.
    const ARCHIVO_MIND = "./pagina.mind";
    const USAR_SONIDO = true; // false: reproducción automática sin voz.
    const CONTENIDOS = [
      {
        targetIndex: 0,
        tipo: "video",             // "video" o "imagen".
        archivo: "./animacion.mp4",
        ancho: 1,
        altoMaximo: null,           // Limita el alto sin deformar, si lo necesitas.
        posicion: "0 0 0.02",
        rotacion: "0 0 0",
        repetir: true,
        reiniciarAlDetectar: false
      }
      // Para más dibujos, añade objetos con targetIndex: 1, 2, etc.
      // Deben estar compilados juntos en el .mind. Ejemplo:
      // ,{ targetIndex: 1, tipo: "video", archivo: "./video2.mp4", ancho: 1 }
      // ,{ targetIndex: 2, tipo: "imagen", archivo: "./imagen3.png", ancho: 1 }
    ];

    const visor = document.querySelector("#visor");
    const escaner = document.querySelector("#escaner");
    const acciones = document.querySelector("#acciones");
    const errorTexto = document.querySelector("#error");
    const boton = document.querySelector("#accion");
    const entradas = [];
    let escena;
    let sistema;
    let activa = null;
    let listo = false;
    let iniciando = false;
    let falloFatal = false;
    let pausadoPorPestana = false;

    function limpiarAcciones() {
      acciones.hidden = true;
      errorTexto.hidden = true;
      boton.hidden = true;
    }

    function actualizarMarco() {
      escaner.hidden = Boolean(activa) || document.hidden || falloFatal;
    }

    function ocultar(entrada) {
      entrada.turno += 1;
      entrada.reproduciendo = false;
      entrada.plano.setAttribute("visible", false);
      if (entrada.config.tipo === "video") entrada.medio.pause();
    }

    function mostrarError(texto, fatal = false) {
      if (fatal) {
        falloFatal = true;
        listo = false;
        entradas.forEach(ocultar);
        activa = null;
        if (sistema?.video?.srcObject) {
          sistema.video.srcObject.getTracks().forEach((pista) => pista.stop());
        }
        sistema?.controller?.stopProcessVideo();
      }
      actualizarMarco();
      acciones.hidden = false;
      errorTexto.textContent = texto;
      errorTexto.hidden = false;
      boton.hidden = false;
      boton.textContent = fatal ? "Volver a intentar" : "Reintentar video";
    }

    function ajustar(entrada) {
      const esVideo = entrada.config.tipo === "video";
      const w = esVideo ? entrada.medio.videoWidth : entrada.medio.naturalWidth;
      const h = esVideo ? entrada.medio.videoHeight : entrada.medio.naturalHeight;
      if (!w || !h) return;
      let ancho = Number(entrada.config.ancho ?? 1);
      let alto = ancho * h / w;
      const maximo = entrada.config.altoMaximo;
      if (maximo != null && alto > Number(maximo)) {
        alto = Number(maximo);
        ancho = alto * w / h;
      }
      entrada.plano.setAttribute("width", ancho);
      entrada.plano.setAttribute("height", alto);
      entrada.cargada = true;
      if (activa === entrada && entrada.detectada && !document.hidden && !entrada.error) {
        entrada.plano.setAttribute("visible", !esVideo || entrada.reproduciendo);
      }
    }

    async function reproducir(entrada) {
      if (activa !== entrada || !entrada.detectada || document.hidden || entrada.error) return;
      const turno = ++entrada.turno;
      entrada.medio.muted = !USAR_SONIDO;
      limpiarAcciones();
      try {
        await entrada.medio.play();
        if (activa !== entrada || !entrada.detectada || document.hidden) {
          entrada.medio.pause();
          return;
        }
        if (turno !== entrada.turno) return;
        entrada.reproduciendo = true;
        entrada.plano.setAttribute("visible", entrada.cargada);
        limpiarAcciones();
      } catch (error) {
        if (activa !== entrada || !entrada.detectada || document.hidden || turno !== entrada.turno) return;
        entrada.reproduciendo = false;
        entrada.plano.setAttribute("visible", false);
        if (error.name === "NotAllowedError") {
          acciones.hidden = false;
          errorTexto.hidden = true;
          boton.hidden = false;
          boton.textContent = "Reproducir video";
        } else if (error.name !== "AbortError") {
          mostrarError(`No se pudo reproducir ${entrada.config.archivo}. Revisa el archivo y su formato.`);
          console.error(error);
        }
      }
    }

    function encontrada(entrada) {
      if (!listo || falloFatal) return;
      entrada.detectada = true;
      if (activa === entrada) return;
      entradas.forEach((otra) => { if (otra !== entrada) ocultar(otra); });
      activa = entrada;
      limpiarAcciones();
      actualizarMarco();
      if (entrada.error) {
        mostrarError(`No se encontró ${entrada.config.archivo}. Revisa su ruta en GitHub.`);
        return;
      }
      entrada.plano.setAttribute("visible", entrada.config.tipo === "imagen" && entrada.cargada && !document.hidden);
      if (entrada.config.tipo === "video") {
        if (entrada.config.reiniciarAlDetectar && entrada.medio.readyState >= 1) entrada.medio.currentTime = 0;
        void reproducir(entrada);
      }
    }

    function perdida(entrada) {
      entrada.detectada = false;
      ocultar(entrada);
      if (activa !== entrada) return;
      activa = null;
      limpiarAcciones();
      actualizarMarco();
    }

    function crearEntrada(config, orden, assets) {
      const esVideo = config.tipo === "video";
      const medio = document.createElement(esVideo ? "video" : "img");
      medio.id = `medio-${orden}`;
      medio.crossOrigin = "anonymous";
      if (esVideo) {
        medio.preload = "metadata";
        medio.muted = true;
        medio.loop = config.repetir !== false;
        medio.setAttribute("muted", "");
        medio.setAttribute("playsinline", "");
        medio.setAttribute("webkit-playsinline", "");
      } else medio.alt = "Imagen de realidad aumentada";
      const ancla = document.createElement("a-entity");
      ancla.id = `dibujo-${config.targetIndex}`;
      ancla.setAttribute("mindar-image-target", `targetIndex: ${config.targetIndex}`);
      const plano = document.createElement(esVideo ? "a-video" : "a-image");
      plano.id = `contenido-${config.targetIndex}`;
      plano.setAttribute("src", `#${medio.id}`);
      plano.setAttribute("width", 1);
      plano.setAttribute("height", 1);
      plano.setAttribute("visible", false);
      plano.setAttribute("position", config.posicion || "0 0 0.02");
      plano.setAttribute("rotation", config.rotacion || "0 0 0");
      plano.setAttribute("material", "shader: flat; side: double; color: #ffffff; opacity: 1");
      const entrada = { config, medio, ancla, plano, cargada: false, detectada: false, reproduciendo: false, error: false, turno: 0 };
      medio.addEventListener(esVideo ? "loadedmetadata" : "load", () => ajustar(entrada));
      medio.addEventListener("error", () => {
        entrada.error = true;
        ocultar(entrada);
        if (activa === entrada) mostrarError(`No se pudo cargar ${config.archivo}. Revisa nombre, ruta y formato.`);
        console.error("Error al cargar contenido:", config.archivo, medio.error);
      });
      ancla.addEventListener("targetFound", () => encontrada(entrada));
      ancla.addEventListener("targetLost", () => perdida(entrada));
      assets.appendChild(medio);
      medio.src = config.archivo;
      ancla.appendChild(plano);
      escena.appendChild(ancla);
      entradas.push(entrada);
    }

    async function iniciar() {
      if (iniciando || listo || falloFatal || !sistema) return;
      iniciando = true;
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        mostrarError("Abre el enlace HTTPS de GitHub Pages en un navegador con acceso a la cámara.", true);
        return;
      }
      try {
        const respuesta = await fetch(ARCHIVO_MIND, { cache: "no-cache" });
        if (!respuesta.ok) throw new Error(`No se encontró ${ARCHIVO_MIND} (HTTP ${respuesta.status}).`);
        if ((respuesta.headers.get("content-type") || "").includes("text/html")) {
          throw new Error("La ruta del .mind devuelve una página HTML, no el archivo de reconocimiento.");
        }
        if (respuesta.body) await respuesta.body.cancel();
        sistema.start();
      } catch (error) {
        mostrarError(`${error.message} Revisa la ruta del .mind y tu conexión.`, true);
      }
    }

    function preparar() {
      if (!window.AFRAME || !AFRAME.components["mindar-image"]) {
        mostrarError("No se cargaron las bibliotecas. Revisa tu conexión y vuelve a intentar.", true);
        return;
      }
      try {
        if (!CONTENIDOS.length) throw new Error("Añade al menos un contenido.");
        const indices = new Set();
        for (const c of CONTENIDOS) {
          if (!Number.isInteger(c.targetIndex) || c.targetIndex < 0 || indices.has(c.targetIndex)) throw new Error("Usa un targetIndex entero y distinto para cada dibujo.");
          if (!["video", "imagen"].includes(c.tipo) || !c.archivo) throw new Error("Cada contenido requiere tipo y archivo.");
          if (!(Number(c.ancho ?? 1) > 0) || (c.altoMaximo != null && !(Number(c.altoMaximo) > 0))) throw new Error("Revisa ancho y altoMaximo: deben ser positivos.");
          indices.add(c.targetIndex);
        }
      } catch (error) { mostrarError(error.message, true); return; }
      escena = document.createElement("a-scene");
      escena.setAttribute("mindar-image", `imageTargetSrc: ${ARCHIVO_MIND}; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no;`);
      escena.setAttribute("renderer", "colorManagement: true; antialias: true; alpha: true");
      escena.setAttribute("xr-mode-ui", "enabled: false");
      escena.setAttribute("device-orientation-permission-ui", "enabled: false");
      escena.setAttribute("loading-screen", "enabled: false");
      const assets = document.createElement("a-assets");
      assets.setAttribute("timeout", "10000");
      escena.appendChild(assets);
      const camara = document.createElement("a-camera");
      camara.setAttribute("position", "0 0 0");
      camara.setAttribute("look-controls", "enabled: false");
      camara.setAttribute("wasd-controls", "enabled: false");
      escena.appendChild(camara);
      CONTENIDOS.forEach((c, i) => crearEntrada(c, i, assets));
      escena.addEventListener("renderstart", () => {
        sistema = escena.systems["mindar-image-system"];
        void iniciar(); // Sin pantalla de bienvenida ni botón de inicio.
      }, { once: true });
      escena.addEventListener("arReady", () => {
        if (falloFatal) return;
        listo = true;
        iniciando = false;
        limpiarAcciones();
        actualizarMarco();
      });
      escena.addEventListener("arError", () => {
        mostrarError("Permite el acceso a la cámara en tu navegador y vuelve a intentar.", true);
      });
      visor.appendChild(escena);
    }

    boton.addEventListener("click", () => {
      if (falloFatal) { location.reload(); return; }
      if (activa?.config.tipo === "video") {
        if (activa.error) { location.reload(); return; }
        void reproducir(activa);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        entradas.forEach(ocultar);
        limpiarAcciones();
        actualizarMarco();
        if (listo && sistema?.controller) {
          sistema.pause(true);
          pausadoPorPestana = true;
        }
      } else if (listo && !falloFatal) {
        if (pausadoPorPestana) { sistema.unpause(); pausadoPorPestana = false; }
        actualizarMarco();
        if (activa?.detectada && !activa.error) {
          activa.plano.setAttribute("visible", activa.config.tipo === "imagen" && activa.cargada);
          if (activa.config.tipo === "video") void reproducir(activa);
        }
      }
    });
    window.addEventListener("unhandledrejection", (evento) => {
      if (iniciando && !listo && !falloFatal) {
        console.error(evento.reason);
        mostrarError("No se pudo iniciar el reconocimiento. Revisa que el .mind sea válido y permite la cámara.", true);
      }
    });
    preparar();
  </script>
</body>
</html>
