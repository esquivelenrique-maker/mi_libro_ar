<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Realidad aumentada del libro</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #mensaje {
      position: fixed;
      z-index: 10;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    #iniciar {
      display: none;
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
      color: #111111;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="mensaje">
    Apunta la cámara hacia la página del libro
  </div>

  <button id="iniciar">Reproducir animación</button>

  <a-scene
    mindar-image="
      imageTargetSrc: ./pagina.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="videoAnimacion"
        src="./animacion.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- targetIndex 0 corresponde a pagina.mind -->
    <a-entity
      id="paginaObjetivo"
      mindar-image-target="targetIndex: 0">

      <!-- Cambia estos valores si tu video tiene otra proporción -->
      <a-video
        id="videoAR"
        src="#videoAnimacion"
        width="1"
        height="0.5625"
        position="0 0 0.02"
        rotation="0 0 0">
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    const paginaObjetivo = document.querySelector("#paginaObjetivo");
    const video = document.querySelector("#videoAnimacion");
    const mensaje = document.querySelector("#mensaje");
    const botonIniciar = document.querySelector("#iniciar");

    paginaObjetivo.addEventListener("targetFound", () => {
      mensaje.textContent = "Página reconocida";

      video.currentTime = 0;

      const reproduccion = video.play();

      if (reproduccion !== undefined) {
        reproduccion.catch(() => {
          botonIniciar.style.display = "block";
          mensaje.textContent = "Pulsa el botón para reproducir la animación";
        });
      }
    });

    paginaObjetivo.addEventListener("targetLost", () => {
      mensaje.textContent = "Apunta nuevamente hacia la página";
      video.pause();
      botonIniciar.style.display = "none";
    });

    botonIniciar.addEventListener("click", () => {
      video.play();
      botonIniciar.style.display = "none";
    });
  </script>
</body>
</html>
